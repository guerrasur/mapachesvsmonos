<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e6edcf">
  <meta name="description" content="Un pequeño juego de búsqueda y captura de mapaches mutantes.">
  <title>Mapaches vs. Monos</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=0.2.0">
</head>
<body>
  <div class="app">
    <header><h1>MAPACHES <span>vs.</span> MONOS</h1><div class="version-tools"><span id="version">v0.2.0</span><button id="update" type="button" aria-label="Buscar actualizaciones">↻</button></div></header>
    <main>
      <section class="hunt" aria-label="Zona de búsqueda">
        <div class="scene"><canvas id="scene" width="240" height="208" aria-hidden="true"></canvas><div class="choices" role="group" aria-label="Elegí un arbusto"><button type="button" data-bush="0" aria-label="Buscar en el arbusto de arriba"><span>1</span></button><button type="button" data-bush="1" aria-label="Buscar en el arbusto de la izquierda"><span>2</span></button><button type="button" data-bush="2" aria-label="Buscar en el arbusto de la derecha"><span>3</span></button></div></div>
        <div class="result" aria-live="polite" aria-atomic="true"><div><p id="result-label" hidden></p><h2 id="result-title">Elegí un arbusto.</h2><p id="result-detail">Tocá para buscar.</p></div><button id="next" class="primary" type="button" hidden>Otra búsqueda <span aria-hidden="true">▶</span></button></div>
      </section>
      <section class="collection" aria-labelledby="collection-title"><div class="section-heading"><h2 id="collection-title">COLECCIÓN</h2><span id="collection-count">0 / 2</span></div><div id="cards" class="cards"></div><p id="save-status" class="save-status" hidden></p></section>
    </main>
    <p id="update-status" class="update-status" role="status" hidden></p>
  </div>
  <script type="module" src="./src/app.js?v=0.2.0"></script>
</body>
</html>
